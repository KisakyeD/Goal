        :root {
            --bg-color: #0f0f0f;
            --body-bg: #000000;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --subtext-color: #888888;
            --card-bg: #1c1c1c;
            --btn-bg: #1e1e1e;
            --border-color: #2a2a2a;
            --modal-bg: #1a1a1a;
            --modal-border: #333333;
            --menu-bg: #161616;
            --hover-bg: #242424;
            --select-bg: #2a2a2a;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        body {
            background-color: var(--body-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--bg-color);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid var(--border-color);
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--btn-bg);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 900;
            color: var(--accent-green);
            letter-spacing: -0.5px;
            display: flex;
            align-items: baseline;
            user-select: none;
            cursor: pointer;
        }

        .brand-logo span {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-color);
            margin-left: 2px;
            vertical-align: super;
        }

        /* Infinite Horizontal Calendar */
        .calendar-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .calendar-bar::-webkit-scrollbar {
            display: none;
        }

        .date-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 62px;
            padding: 6px 12px;
            border-radius: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }

        .date-chip.active {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .date-chip.active .day-name,
        .date-chip.active .day-number {
            color: #000000;
            font-weight: 800;
        }
