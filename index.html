<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wins1™ - AI Predictions</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --body-bg: #000000;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --subtext-color: #888888;
            --card-bg: #1c1c1c;
            --btn-bg: #1e1e1e;
            --border-color: #2a2a2a;
            --modal-bg: #1a1a1a;
            --modal-border: #333333;
            --menu-bg: #161616;
            --hover-bg: #242424;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        body {
            background-color: var(--body-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--bg-color);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid var(--border-color);
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--btn-bg);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 900;
            color: var(--accent-green);
            letter-spacing: -0.5px;
            display: flex;
            align-items: baseline;
            user-select: none;
            cursor: pointer;
        }

        .brand-logo span {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-color);
            margin-left: 2px;
            vertical-align: super;
        }

        /* Infinite Horizontal Calendar */
        .calendar-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .calendar-bar::-webkit-scrollbar {
            display: none;
        }

        .date-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 62px;
            padding: 6px 12px;
            border-radius: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }

        .date-chip.active {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .date-chip.active .day-name,
        .date-chip.active .day-number {
            color: #000000;
            font-weight: 800;
        }

        .day-name {
            font-size: 10px;
            font-weight: 700;
            color: var(--subtext-color);
            text-transform: uppercase;
        }

        .day-number {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-color);
            margin-top: 2px;
            white-space: nowrap;
        }

        /* Feed Cards */
        .feed-container {
            padding: 16px;
        }

        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            position: relative;
        }

        .match-status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--subtext-color);
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-color);
            margin: 4px 0;
        }

        .score-box {
            font-size: 15px;
            font-weight: 800;
            color: var(--accent-green);
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            user-select: none;
        }

        .status-win { background-color: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .status-loss { background-color: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .status-pending { background-color: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid var(--accent-amber); }

        .pred-pick-row {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            font-weight: 700;
            font-size: 13px;
            color: var(--accent-green);
        }

        /* Overlay & Drawer */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background-color: var(--menu-bg);
            z-index: 101;
            transition: transform 0.25s ease-in-out;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .side-menu.open {
            transform: translateX(300px);
        }

        .menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--subtext-color);
            font-size: 22px;
            cursor: pointer;
        }

        .menu-list {
            list-style: none;
            padding: 8px 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .menu-item:hover {
            background-color: var(--hover-bg);
        }

        .menu-item .icon {
            margin-right: 12px;
            width: 20px;
            text-align: center;
        }

        .spinner-center {
            text-align: center;
            padding: 30px;
            color: var(--subtext-color);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Bar -->
        <header class="top-bar">
            <button class="icon-btn" id="menuToggle" aria-label="Open Menu">
                <svg width="18" height="12" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="0" y1="2" x2="20" y2="2" />
                    <line x1="0" y1="7" x2="20" y2="7" />
                    <line x1="0" y1="12" x2="20" y2="12" />
                </svg>
            </button>
            <div class="brand-logo home-btn">
                Wins1<span>TM</span>
            </div>
            <div style="width: 40px;"></div>
        </header>

        <!-- Continuous Calendar Bar -->
        <div class="calendar-bar" id="homepageCalendar"></div>

        <!-- Main Feed Container -->
        <div class="feed-container" id="mainMatchFeed">
            <div class="spinner-center">Loading Wins1™ predictions...</div>
        </div>
    </div>

    <!-- Background Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Side Menu Drawer -->
    <aside class="side-menu" id="sideMenu">
        <div class="menu-header">
            <div class="brand-logo home-btn">Wins1<span>TM</span></div>
            <button class="close-btn" id="menuClose">&times;</button>
        </div>
        <ul class="menu-list">
            <li class="menu-item" id="btnPredictions"><span class="icon">🔮</span> AI Predictions</li>
        </ul>
    </aside>

    <!-- JavaScript Engine -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const menuClose = document.getElementById('menuClose');
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');
        const calendarBar = document.getElementById('homepageCalendar');

        let selectedDateOffset = 0;

        function formatDateYYYYMMDD(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}${m}${d}`;
        }

        // Generate continuous date range (-30 days to +30 days)
        function renderContinuousCalendar() {
            let html = "";
            const pastDays = 30;
            const futureDays = 30;

            for (let offset = -pastDays; offset <= futureDays; offset++) {
                const date = new Date();
                date.setDate(date.getDate() + offset);

                let dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                let dayNumber = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

                if (offset === 0) dayName = "TODAY";
                else if (offset === -1) dayName = "YEST";
                else if (offset === 1) dayName = "TOMM";

                const isActive = offset === selectedDateOffset ? "active" : "";
                const chipId = `date-chip-${offset}`;

                html += `
                    <div class="date-chip ${isActive}" id="${chipId}" onclick="selectDate(${offset})">
                        <span class="day-name">${dayName}</span>
                        <span class="day-number">${dayNumber}</span>
                    </div>
                `;
            }
            calendarBar.innerHTML = html;

            // Auto-scroll to center on Today or selected chip
            setTimeout(() => {
                const activeChip = document.getElementById(`date-chip-${selectedDateOffset}`);
                if (activeChip) {
                    activeChip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            }, 100);
        }

        function selectDate(offset) {
            selectedDateOffset = offset;
            renderContinuousCalendar();
            fetchMainAIPredictions(offset);
        }

        async function fetchMainAIPredictions(offset) {
            const feedContainer = document.getElementById('mainMatchFeed');
            feedContainer.innerHTML = `<div class="spinner-center">Loading Wins1™ predictions...</div>`;

            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + offset);
            const dateStr = formatDateYYYYMMDD(targetDate);

            try {
                const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${dateStr}&limit=50`);
                const data = await response.json();

                if (data && data.events && data.events.length > 0) {
                    let html = "";
                    data.events.slice(0, 25).forEach(evt => {
                        const comp = evt.competitions[0];
                        const home = comp.competitors.find(c => c.homeAway === 'home');
                        const away = comp.competitors.find(c => c.homeAway === 'away');
                        
                        const homeName = home?.team?.displayName || "Home Team";
                        const awayName = away?.team?.displayName || "Away Team";
                        const leagueName = comp.league?.name || data.leagues[0]?.name || "Global Football";

                        const isFinished = evt.status?.type?.state === "post";
                        const homeScore = parseInt(home?.score || 0);
                        const awayScore = parseInt(away?.score || 0);
                        const totalGoals = homeScore + awayScore;

                        let isWin = totalGoals >= 2;
                        let badgeClass = "status-pending";
                        let badgeHtml = `⌛ PENDING`;

                        if (isFinished) {
                            if (isWin) {
                                badgeClass = "status-win";
                                badgeHtml = `✓ WIN`;
                            } else {
                                badgeClass = "status-loss";
                                badgeHtml = `✕ LOSS`;
                            }
                        }

                        html += `
                            <div class="match-card">
                                <div class="match-status-row">
                                    <span>${leagueName}</span>
                                    <span class="status-badge ${badgeClass}">${badgeHtml}</span>
                                </div>
                                <div class="team-row">
                                    <span>${homeName}</span>
                                    <span class="score-box">${home?.score !== undefined ? home.score : 0}</span>
                                </div>
                                <div class="team-row">
                                    <span>${awayName}</span>
                                    <span class="score-box">${away?.score !== undefined ? away.score : 0}</span>
                                </div>
                                <div class="pred-pick-row">Pick: Over 1.5 Goals</div>
                            </div>
                        `;
                    });
                    feedContainer.innerHTML = html;
                } else {
                    feedContainer.innerHTML = `<div class="spinner-center">No AI prediction matches scheduled for this date.</div>`;
                }
            } catch (err) {
                feedContainer.innerHTML = `<div class="spinner-center">Unable to load Wins1™ AI predictions.</div>`;
            }
        }

        function openMenu() {
            sideMenu.classList.add('open');
            overlay.classList.add('active');
        }

        function closeMenu() {
            sideMenu.classList.remove('open');
            overlay.classList.remove('active');
        }

        menuToggle.addEventListener('click', openMenu);
        menuClose.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);

        // App Start
        renderContinuousCalendar();
        fetchMainAIPredictions(0);
    </script>
</body>
</html>
