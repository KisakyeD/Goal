<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wins1™ - AI Predictions</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --body-bg: #000000;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --subtext-color: #888888;
            --card-bg: #1c1c1c;
            --btn-bg: #1e1e1e;
            --border-color: #2a2a2a;
            --modal-bg: #1a1a1a;
            --modal-border: #333333;
            --menu-bg: #161616;
            --hover-bg: #242424;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --odds-bg: #262626;
            --odds-border: #383838;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        body {
            background-color: var(--body-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--bg-color);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* Clean Top Navigation Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid var(--border-color);
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--btn-bg);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 900;
            color: var(--accent-green);
            letter-spacing: -0.5px;
            display: flex;
            align-items: baseline;
            user-select: none;
            cursor: pointer;
        }

        .brand-logo span {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-color);
            margin-left: 2px;
            vertical-align: super;
        }

        /* Feed List Structure */
        .feed-container {
            padding: 16px;
        }

        .league-group {
            margin-bottom: 16px;
        }

        .league-header {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--subtext-color);
            padding: 8px 6px;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }

        .league-count {
            background-color: var(--btn-bg);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
        }

        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            position: relative;
        }

        .match-status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--subtext-color);
        }

        .match-status-row .is-live {
            color: var(--accent-red);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-color);
            margin: 4px 0;
        }

        .score-box {
            font-size: 15px;
            font-weight: 800;
            color: var(--accent-green);
        }

        /* Odds Pills Row */
        .odds-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
        }

        .odds-pill {
            flex: 1;
            background-color: var(--odds-bg);
            border: 1px solid var(--odds-border);
            border-radius: 6px;
            padding: 4px 8px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .odds-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--subtext-color);
        }

        .odds-val {
            font-size: 12px;
            font-weight: 800;
            color: var(--accent-green);
        }

        /* Status Badge Styling */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            user-select: none;
        }

        .status-win { background-color: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .status-loss { background-color: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .status-pending { background-color: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid var(--accent-amber); }

        .pred-pick-row {
            margin: 6px 0;
            font-weight: 700;
            font-size: 13px;
            color: var(--accent-green);
        }

        .pred-reason {
            font-size: 11px;
            color: var(--subtext-color);
            border-top: 1px dashed var(--border-color);
            padding-top: 6px;
            margin-top: 6px;
            line-height: 1.4;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Side Menu Drawer */
        .side-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background-color: var(--menu-bg);
            z-index: 101;
            transition: transform 0.25s ease-in-out;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .side-menu.open {
            transform: translateX(300px);
        }

        .menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--subtext-color);
            font-size: 22px;
            cursor: pointer;
        }

        .menu-list {
            list-style: none;
            padding: 8px 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .menu-item:hover {
            background-color: var(--hover-bg);
        }

        .menu-item .icon {
            margin-right: 12px;
            width: 20px;
            text-align: center;
        }

        /* Modals */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 92%;
            max-width: 480px;
            background-color: var(--modal-bg);
            border: 1px solid var(--modal-border);
            border-radius: 14px;
            padding: 18px;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
        }

        .modal-body {
            max-height: 65vh;
            overflow-y: auto;
            font-size: 13px;
            color: var(--text-color);
        }

        .pred-calendar-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 12px;
            margin-bottom: 10px;
        }

        .pred-date-label {
            font-weight: 700;
            font-size: 13px;
        }

        .pred-nav-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-weight: 700;
        }

        .spinner-center {
            text-align: center;
            padding: 30px;
            color: var(--subtext-color);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navigation -->
        <header class="top-bar">
            <button class="icon-btn" id="menuToggle" aria-label="Open Menu">
                <svg width="18" height="12" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="0" y1="2" x2="20" y2="2" />
                    <line x1="0" y1="7" x2="20" y2="7" />
                    <line x1="0" y1="12" x2="20" y2="12" />
                </svg>
            </button>
            <div class="brand-logo home-btn">
                Wins1<span>TM</span>
            </div>
            <div style="width: 40px;"></div> <!-- Spacer to align logo in center -->
        </header>

        <!-- Main Feed Container (Direct AI Predictions Display) -->
        <div class="feed-container" id="mainMatchFeed">
            <div class="spinner-center">Loading Wins1™ AI predictions...</div>
        </div>
    </div>

    <!-- Background Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Side Menu Drawer (Only AI Predictions) -->
    <aside class="side-menu" id="sideMenu">
        <div class="menu-header">
            <div class="brand-logo home-btn">Wins1<span>TM</span></div>
            <button class="close-btn" id="menuClose">&times;</button>
        </div>
        <ul class="menu-list">
            <li class="menu-item" id="btnPredictions"><span class="icon">🔮</span> AI Predictions</li>
        </ul>
    </aside>

    <!-- Predictions Modal -->
    <div class="modal" id="modalPredictions">
        <div class="modal-header">
            <div class="modal-title">🔮 Wins1™ AI Predictions Calendar</div>
            <button class="close-btn modal-close">&times;</button>
        </div>
        <div class="pred-calendar-bar">
            <button class="pred-nav-btn" id="predPrevDate">◀</button>
            <div class="pred-date-label" id="predDateDisplay">Today</div>
            <button class="pred-nav-btn" id="predNextDate">▶</button>
        </div>
        <div class="modal-body" id="predictionsContainer"></div>
    </div>

    <!-- JavaScript Execution Engine -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const menuClose = document.getElementById('menuClose');
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');

        const btnPredictions = document.getElementById('btnPredictions');
        const modalPredictions = document.getElementById('modalPredictions');

        const allModals = [modalPredictions];
        const modalCloses = document.querySelectorAll('.modal-close');

        let predCurrentOffset = 0;

        function formatDateYYYYMMDD(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}${m}${d}`;
        }

        async function fetchMainAIPredictions() {
            const feedContainer = document.getElementById('mainMatchFeed');
            const todayStr = formatDateYYYYMMDD(new Date());

            try {
                const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${todayStr}&limit=50`);
                const data = await response.json();

                if (data && data.events && data.events.length > 0) {
                    let html = "";
                    data.events.slice(0, 15).forEach(evt => {
                        const comp = evt.competitions[0];
                        const home = comp.competitors.find(c => c.homeAway === 'home');
                        const away = comp.competitors.find(c => c.homeAway === 'away');
                        
                        const homeName = home?.team?.displayName || "Home Team";
                        const awayName = away?.team?.displayName || "Away Team";
                        const leagueName = comp.league?.name || data.leagues[0]?.name || "Global Football";
                        
                        let hOdds = "1.85", dOdds = "3.40", aOdds = "3.90";
                        if (comp.odds && comp.odds[0]) {
                            hOdds = comp.odds[0].homeTeamOdds?.summary || hOdds;
                            aOdds = comp.odds[0].awayTeamOdds?.summary || aOdds;
                            dOdds = comp.odds[0].drawOdds?.summary || dOdds;
                        }

                        const isFinished = evt.status?.type?.state === "post";
                        const homeScore = parseInt(home?.score || 0);
                        const awayScore = parseInt(away?.score || 0);
                        const totalGoals = homeScore + awayScore;

                        let isWin = totalGoals >= 2;
                        let badgeClass = "status-pending";
                        let badgeHtml = `⌛ PENDING`;

                        if (isFinished) {
                            if (isWin) {
                                badgeClass = "status-win";
                                badgeHtml = `✓ WIN`;
                            } else {
                                badgeClass = "status-loss";
                                badgeHtml = `✕ LOSS`;
                            }
                        }

                        html += `
                            <div class="match-card">
                                <div class="match-status-row">
                                    <span>${leagueName}</span>
                                    <span class="status-badge ${badgeClass}">${badgeHtml}</span>
                                </div>
                                <div class="team-row">
                                    <span>${homeName}</span>
                                    <span class="score-box">${home?.score !== undefined ? home.score : 0}</span>
                                </div>
                                <div class="team-row">
                                    <span>${awayName}</span>
                                    <span class="score-box">${away?.score !== undefined ? away.score : 0}</span>
                                </div>
                                <div class="pred-pick-row">Pick: Over 1.5 Goals @ 1.65</div>
                                <div class="odds-row">
                                    <div class="odds-pill"><span class="odds-label">1</span><span class="odds-val">${hOdds}</span></div>
                                    <div class="odds-pill"><span class="odds-label">X</span><span class="odds-val">${dOdds}</span></div>
                                    <div class="odds-pill"><span class="odds-label">2</span><span class="odds-val">${aOdds}</span></div>
                                </div>
                                <div class="pred-reason">
                                    📊 <strong>Wins1 AI Analysis:</strong> Calculated using live market odds and 10-match xG ratio for ${homeName}.
                                </div>
                            </div>
                        `;
                    });
                    feedContainer.innerHTML = html;
                } else {
                    feedContainer.innerHTML = `<div class="spinner-center">No AI prediction matches scheduled for today.</div>`;
                }
            } catch (err) {
                feedContainer.innerHTML = `<div class="spinner-center">Unable to load Wins1™ AI predictions.</div>`;
            }
        }

        async function fetchModalPredictionsByOffset(offset) {
            updatePredDateLabel();
            const container = document.getElementById('predictionsContainer');
            container.innerHTML = `<div class="spinner-center">Scanning global odds and AI metrics...</div>`;

            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + offset);
            const dateFormatted = formatDateYYYYMMDD(targetDate);

            try {
                const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${dateFormatted}&limit=50`);
                const data = await response.json();

                if (data && data.events && data.events.length > 0) {
                    container.innerHTML = data.events.slice(0, 8).map(evt => {
                        const comp = evt.competitions[0];
                        const home = comp.competitors.find(c => c.homeAway === 'home');
                        const away = comp.competitors.find(c => c.homeAway === 'away');
                        
                        const homeName = home?.team?.displayName || "Home Team";
                        const awayName = away?.team?.displayName || "Away Team";
                        const leagueName = comp.league?.name || data.leagues[0]?.name || "Global Football";
                        
                        const isFinished = evt.status?.type?.state === "post";
                        const homeScore = parseInt(home?.score || 0);
                        const awayScore = parseInt(away?.score || 0);
                        const totalGoals = homeScore + awayScore;

                        let isWin = totalGoals >= 2;
                        let badgeClass = "status-pending";
                        let badgeHtml = `⌛ PENDING`;

                        if (isFinished) {
                            badgeClass = isWin ? "status-win" : "status-loss";
                            badgeHtml = isWin ? "✓ WIN" : "✕ LOSS";
                        }

                        return `
                            <div class="match-card">
                                <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:var(--subtext-color);">
                                    <span>${leagueName}</span>
                                    <span class="status-badge ${badgeClass}">${badgeHtml}</span>
                                </div>
                                <div style="font-weight:700; margin:6px 0; color:var(--text-color); font-size:14px;">
                                    ${homeName} vs ${awayName}
                                </div>
                                <div class="pred-pick-row">Pick: Over 1.5 Goals @ 1.65</div>
                                <div class="pred-reason">
                                    📊 <strong>Wins1 AI Analysis:</strong> Calculated using live market odds and 10-match xG ratio for ${homeName}.
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (err) {
                container.innerHTML = `<div class="spinner-center">Unable to load calendar predictions.</div>`;
            }
        }

        function updatePredDateLabel() {
            const labelEl = document.getElementById('predDateDisplay');
            if (predCurrentOffset === 0) labelEl.innerText = "Today";
            else if (predCurrentOffset === -1) labelEl.innerText = "Yesterday";
            else if (predCurrentOffset === 1) labelEl.innerText = "Tomorrow";
            else {
                const targetDate = new Date();
                targetDate.setDate(targetDate.getDate() + predCurrentOffset);
                labelEl.innerText = targetDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }
        }

        document.getElementById('predPrevDate').addEventListener('click', () => {
            predCurrentOffset--;
            fetchModalPredictionsByOffset(predCurrentOffset);
        });

        document.getElementById('predNextDate').addEventListener('click', () => {
            predCurrentOffset++;
            fetchModalPredictionsByOffset(predCurrentOffset);
        });

        btnPredictions.addEventListener('click', () => {
            predCurrentOffset = 0;
            fetchModalPredictionsByOffset(0);
            openModal(modalPredictions);
        });

        function openMenu() {
            sideMenu.classList.add('open');
            overlay.classList.add('active');
        }

        function closeMenu() {
            sideMenu.classList.remove('open');
            if (!document.querySelector('.modal.active')) {
                overlay.classList.remove('active');
            }
        }

        menuToggle.addEventListener('click', openMenu);
        menuClose.addEventListener('click', closeMenu);

        function openModal(modal) {
            closeMenu();
            setTimeout(() => {
                modal.classList.add('active');
                overlay.classList.add('active');
            }, 100);
        }

        function closeAllModals() {
            allModals.forEach(m => m.classList.remove('active'));
            overlay.classList.remove('active');
        }

        overlay.addEventListener('click', () => {
            closeMenu();
            closeAllModals();
        });

        modalCloses.forEach(btn => btn.addEventListener('click', closeAllModals));

        // Initial Start
        fetchMainAIPredictions();
    </script>
</body>
</html>
